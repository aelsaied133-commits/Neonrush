:root[data-theme="dark"]{--bg:#070514;--fg:#f4f1ff}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

#ps,#fs,#ct{position:absolute;top:12px;right:10px;z-index:4;width:40px;height:40px;border-radius:50%;border:2px solid var(--c);background:rgba(7,5,20,.65);color:var(--c);font-size:17px;display:none;touch-action:manipulation;cursor:pointer}
.card-box{background:rgba(255,255,255,.04);border:1px solid rgba(34,230,255,.22);border-radius:16px;padding:10px 14px;width:100%;max-width:390px;display:flex;flex-direction:column;gap:7px;margin-top:4px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-80px);background:rgba(16,10,38,.95);border:2px solid var(--a);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;font-size:14px;z-index:30;box-shadow:0 0 24px rgba(34,230,255,.5);transition:transform .28s cubic-bezier(.2,.9,.3,1);pointer-events:none;text-align:center;max-width:90vw}

<script>
(function(){
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
{const d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'shadowBlur');if(d)Object.defineProperty(ctx,'shadowBlur',{get(){return d.get.call(ctx)},set(v){d.set.call(ctx,v*QF)}})}
let QF=.55,fpsA=16,lowQ=0;
const $=id=>document.getElementById(id);
let W=360,H=600,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width||360;H=r.height||600;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();

// إشعارات نيون بدلاً من alert التقليدي
let toastT=null;
function notify(msg){
  const el=$('toast');
  el.textContent=X(msg);
  el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),3200);
}

// حالة اللعبة والبيانات المحفوظة (متوافقة تماماً مع neonrush2 + IndexedDB احتياطي)
const SAVE_KEY='neonrush2';
let S={lvl:1,max:1,coins:0,ship:0,own:[0],col:0,best:0,sens:1,df:1,gyro:false,gs:1,touchDrag:true,hideCtl:false,th:{g:0,h:0,b:0},tOwn:['g0','h0','b0'],lang:'ar'};

function applySaveObj(obj){
  if(!obj||typeof obj!=='object')return false;
  if(typeof obj.lvl==='number')S.lvl=Math.max(1,Math.min(1001,Math.floor(obj.lvl)));
  if(typeof obj.max==='number')S.max=Math.max(1,Math.min(1001,Math.floor(obj.max)));
  if(typeof obj.coins==='number')S.coins=Math.max(0,Math.floor(obj.coins));
  if(typeof obj.ship==='number')S.ship=Math.max(0,Math.min(5,Math.floor(obj.ship)));
  if(Array.isArray(obj.own))S.own=Array.from(new Set([0,...obj.own]));
  if(typeof obj.col==='number')S.col=Math.max(0,Math.min(5,Math.floor(obj.col)));
  if(typeof obj.best==='number')S.best=Math.max(0,Math.floor(obj.best));
  if(typeof obj.sens==='number')S.sens=obj.sens;
  if(typeof obj.df==='number')S.df=Math.max(0,Math.min(5,Math.floor(obj.df)));
  if(typeof obj.gyro==='boolean')S.gyro=obj.gyro;
  if(typeof obj.gs==='number')S.gs=obj.gs;
  if(typeof obj.touchDrag==='boolean')S.touchDrag=obj.touchDrag;
  if(typeof obj.hideCtl==='boolean')S.hideCtl=obj.hideCtl;
  if(obj.th&&typeof obj.th==='object')S.th=Object.assign({g:0,h:0,b:0},obj.th);
  if(Array.isArray(obj.tOwn))S.tOwn=Array.from(new Set(['g0','h0','b0',...obj.tOwn]));
  if(['ar','en','fr'].includes(obj.lang))S.lang=obj.lang;
  return true;
}

try{applySaveObj(JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){}

// قاعدة بيانات IndexedDB لحفظ احتياطي تلقائي يمنع ضياع التقدم
function idbOp(mode,val,cb){
  try{
    const rq=indexedDB.open('NeonRushDB',1);
    rq.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('saves'))db.createObjectStore('saves')};
    rq.onsuccess=e=>{
      const db=e.target.result,tx=db.transaction('saves',mode),st=tx.objectStore('saves');
      if(mode==='readwrite')st.put(val,SAVE_KEY);
      else{const g=st.get(SAVE_KEY);g.onsuccess=()=>cb&&cb(g.result)}
    };
  }catch(e){}
}

// استرجاع تلقائي من IndexedDB إذا كانت localStorage فارغة أو أقل تقدماً
idbOp('readonly',null,res=>{
  if(res&&(res.max>S.max||res.coins>S.coins||res.best>S.best)){
    applySaveObj(res);
    try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}
    tv.g=S.th.g;tv.h=S.th.h;tv.b=S.th.b;
    pv=S.ship;
    menu();
  }
});

function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}
  idbOp('readwrite',S);
}

function ship(c,k,col){
  const a=PT[k];c.beginPath();c.moveTo(a[0],a[1]);
  for(let i=2;i<a.length;i+=2)c.lineTo(a[i],a[i+1]);
  c.closePath();c.fillStyle=col;c.shadowColor=col;c.shadowBlur=20;c.fill();

}

let ac;
function beep(f,d,type,v){
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.value=v||.05;
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.08));
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+(d||.08));
  }catch(e){}
}

function triggerEmp(){
  if(st!=='play'||emp<100)return;
  emp=0;updateEmpBtn();
  shake=.45;
  addRing(p.x,PY(),'#4dff9a',Math.max(W,H)*.95,780);

  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.ty==='h'){
      burst(it.x,it.y,'#ff3d8b',12,240);
      items.splice(i,1);
      destroyed++;
      score+=25;
    }
  }
  if(B){
    const dmg=Math.max(5,Math.floor(B.m*.22));
    B.hp-=dmg;B.fl=.25;
    burst(B.x,B.y,'#4dff9a',40,340);
    if(B.hp<=0){defeatBoss();return}
  }
  if(destroyed>0)S.coins+=destroyed*DF[S.df].cm;
}

  burst(B.x,B.y,'#ff8a3d',70,420);

  B=null;win();
}

  for(let i=0;i<n;i++){

function spawn(){
  const r=Math.random();
  const hz=Math.max(.1,Math.min(.82,LV.hz+DF[S.df].hz));
  let ty;
  if(r<hz)ty='h';
  else if(r<hz+(1-hz)*.74)ty='g';
  else{
    const pr=Math.random();
    if(pr<.30)ty='s';      // درع
    else if(pr<.54)ty='m'; // مغناطيس
    else if(pr<.76)ty='w'; // ليزر
    else if(pr<.90)ty='z'; // إبطاء الوقت
    else ty='v';           // قلب حياة
  }
  const sc=H/700;
  items.push({
    ty,
    x:30+Math.random()*(W-60),
    y:-30,
    vx:0,
    vy:250*LV.sm*DF[S.df].sp*sc*(.92+Math.random()*.16),
    rot:Math.random()*6,
    rs:(Math.random()-.5)*4
  });
}

    const dx=e.gamma-g0,dy=e.beta-b0,a=(((screen.orientation&&screen.orientation.angle)||window.orientation||0)+360)%360;
    let nx=dx,ny=dy;
    if(a===90){nx=dy;ny=-dx}else if(a===270){nx=-dy;ny=dx}else if(a===180){nx=-dx;ny=-dy}
    gx=gx===null?nx:gx+(nx-gx)*.3;gy=gy===null?ny:gy+(ny-gy)*.3;
  }
};

const PY=()=>p&&p.y?p.y:H*.82;

function update(dt){
  const slowFactor=slowmo>0?.55:1;
  const dir0=(R?1:0)-(L?1:0),dir=S.gyro&&gx!==null&&Math.abs(gx)>3?Math.max(-1.5,Math.min(1.5,dir0+gx/22*S.gs)):dir0;
  p.vx+=dir*W*9*K.sp*S.sens*dt;p.vx*=Math.max(0,1-(dir?3:9)*dt);
  const mx=W*1.3*K.sp*S.sens;p.vx=Math.max(-mx,Math.min(mx,p.vx));
  const dv0=(D?1:0)-(U?1:0),dv=S.gyro&&gy!==null&&Math.abs(gy)>4?Math.max(-1.5,Math.min(1.5,dv0+gy/22*S.gs)):dv0,vm=H*.9*K.sp*S.sens;
  p.vy+=dv*H*6*K.sp*S.sens*dt;p.vy*=Math.max(0,1-(dv?3:9)*dt);p.vy=Math.max(-vm,Math.min(vm,p.vy));
  p.y+=p.vy*dt;if(p.y<H*.3){p.y=H*.3;p.vy=0}if(p.y>H-36){p.y=H-36;p.vy=0}
  p.x+=p.vx*dt;if(p.x<22){p.x=22;p.vx=0}if(p.x>W-22){p.x=W-22;p.vx=0}

  t+=dt;score+=dt*3;
  shield=S.lvl>1000?99:Math.max(0,shield-dt);
  magnet=Math.max(0,magnet-dt);
  laser=Math.max(0,laser-dt);
  slowmo=Math.max(0,slowmo-dt);
  shake=Math.max(0,shake-dt);

  const py=PY();

  // إطلاق الليزر (أثناء الزعيم أو عند أخذ قدرة الليزر الخارق)
  if(B||laser>0){
    ft-=dt;
    if(ft<=0){
      ft=laser>0?.11:.14;
      if(laser>0){
        bul.push({x:p.x-11,y:py-20},{x:p.x+11,y:py-20});
      }else{
        bul.push({x:p.x,y:py-24});
      }
    }
  }

  // تحديث طلقات الليزر وتدمير العقبات أو إصابة الزعيم
  for(let i=bul.length-1;i>=0;i--){
    const b=bul[i];b.y-=H*1.35*dt;
    if(b.y<-15){bul.splice(i,1);continue}
    let hit=false;
    if(B&&Math.abs(b.x-B.x)<48&&Math.abs(b.y-B.y)<36){
      bul.splice(i,1);B.hp--;B.fl=.08;hit=true;
      burst(b.x,b.y,'#ffd84a',3,120);
      if(B.hp<=0){defeatBoss();return}
    }
    if(!hit){
      for(let j=items.length-1;j>=0;j--){
        const it=items[j];
        if(it.ty==='h'&&Math.hypot(b.x-it.x,b.y-it.y)<26){
          bul.splice(i,1);items.splice(j,1);
          burst(it.x,it.y,'#ff8a3d',10,190);
          score+=15;emp=Math.min(100,emp+3);updateEmpBtn();
          beep(420,.05,'triangle',.03);
          break;
        }
      }
    }
  }

  // حركة وهجوم الزعيم المطور
  if(B){
    const rage=B.hp<B.m*.5?1.35:1;
    B.y+=(90-B.y)*Math.min(1,dt*2);
    B.x+=B.d*dt*(62+S.lvl*.16)*rage*slowFactor*W/360;
    if(B.x>W-52){B.x=W-52;B.d=-1}
    if(B.x<52){B.x=52;B.d=1}
    B.fl=Math.max(0,B.fl-dt);
    B.at-=dt*slowFactor;
    if(B.at<=0&&B.y>60){
      B.at=Math.max(.55,(1.45-S.lvl*.0008)/rage);
      const v=250*LV.sm*DF[S.df].sp*H/700;
      B.pat=(B.pat+1)%3;
      if(B.pat===0){
        for(const o of[-62,0,62])items.push({ty:'h',x:Math.max(22,Math.min(W-22,B.x+o)),y:B.y+40,vx:o*.4,vy:v,rot:0,rs:3});
      }else if(B.pat===1){
        const ang=Math.atan2(py-B.y,p.x-B.x);
        for(const a of[-0.22,0,0.22])items.push({ty:'h',x:B.x,y:B.y+38,vx:Math.cos(ang+a)*v*.75,vy:Math.sin(ang+a)*v,rot:0,rs:4});
      }else{
        for(const o of[-85,-30,30,85])items.push({ty:'h',x:Math.max(22,Math.min(W-22,B.x+o)),y:B.y+36,vx:0,vy:v*1.05,rot:0,rs:3.5});
      }
    }
  }

  spawnT-=dt*slowFactor;
  if(spawnT<=0){
    spawn();
    spawnT=Math.max(.14,LV.si*DF[S.df].si)*(.7+Math.random()*.6);
  }

  // عادم السفينة النيون
  parts.push({
    x:p.x+(Math.random()-.5)*8,
    y:py+18,
    vx:(Math.random()-.5)*30-p.vx*.05,
    vy:120+Math.random()*80,
    l:.35,m:.35,
    c:laser>0?'#ff8a3d':(Math.random()<.5?COLS[S.col]:'#ffd84a'),
    s:2.6
  });

  // تحديث العناصر، المغناطيس، والتصادمات
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    const spdMul=it.ty==='h'?slowFactor:1;
    if(it.vx)it.x+=it.vx*dt*spdMul;
    it.y+=it.vy*dt*spdMul;
    it.rot+=it.rs*dt*spdMul;

    // جذب الجواهر بالمغناطيس
    if(it.ty==='g'&&magnet>0){
      const dx=p.x-it.x,dy=py-it.y,dist=Math.hypot(dx,dy);
      if(dist<W*.68&&dist>1){
        const pull=(1-dist/(W*.68))*580*dt;
        it.x+=(dx/dist)*pull;
        it.y+=(dy/dist)*pull;
      }
    }

    const d=Math.hypot(it.x-p.x,it.y-py),rad=it.ty==='h'?23:27;
    if(d<rad+K.r){
      items.splice(i,1);
      if(it.ty==='g'){
        combo++;lg++;S.coins+=DF[S.df].cm;
        const pts=10*(1+Math.floor(combo/5));
        score+=pts;
        const wasReady=emp>=100;
        emp=Math.min(100,emp+7);
        updateEmpBtn();
        if(!wasReady&&emp>=100){addFloat(p.x,py-46,'موجة نيون جاهزة!','#4dff9a');beep(1040,.18,'triangle')}
        burst(it.x,it.y,'#22e6ff',14,180);
        if(combo%5===0)addFloat(it.x,it.y,'🔥 x'+combo,'#ffd84a');
        else addFloat(it.x,it.y,'+'+pts,'#22e6ff');
        beep(700+Math.min(combo,20)*30,.07,'triangle');
        if(!LV.b&&lg>=LV.goal){win();return}
      }
      else if(it.ty==='s'){
        shield=K.sh;burst(it.x,it.y,'#4dff9a',18,220);
        addRing(p.x,py,'#4dff9a',85,260);addFloat(p.x,py-30,'درع الطاقة!','#4dff9a');
        beep(900,.2,'sine');
      }
      else if(it.ty==='m'){
        magnet=7;burst(it.x,it.y,'#b07bff',18,220);
        addRing(p.x,py,'#b07bff',95,260);addFloat(p.x,py-30,'🧲 مغناطيس!','#b07bff');
        beep(820,.2,'triangle');
      }
      else if(it.ty==='w'){
        laser=6;burst(it.x,it.y,'#ffd84a',18,220);
        addRing(p.x,py,'#ffd84a',95,280);addFloat(p.x,py-30,'⚡ ليزر خارق!','#ffd84a');
        beep(980,.22,'sawtooth');
      }
      else if(it.ty==='z'){
        slowmo=5;burst(it.x,it.y,'#22e6ff',18,220);
        addRing(p.x,py,'#22e6ff',110,240);addFloat(p.x,py-30,'⏱️ إبطاء الوقت!','#22e6ff');
        beep(520,.25,'sine');
      }
      else if(it.ty==='v'){
        lives=Math.min(6,lives+1);burst(it.x,it.y,'#ff6fae',18,220);
        addFloat(p.x,py-30,'♥ حياة إضافية!','#ff6fae');
        beep(660,.2,'sine');
      }
      else{
        if(shield>0){
          shield=0;burst(it.x,it.y,'#4dff9a',24,260);
          addRing(p.x,py,'#4dff9a',110,350);
          beep(300,.15,'square');
        }else{
          lives--;combo=0;shake=.42;
          burst(p.x,py,'#ff3d5a',34,320);
          addRing(p.x,py,'#ff3d5a',130,380);
          beep(160,.25,'sawtooth',.07);
          if(lives<=0){over();return}
        }
      }
    }else if(it.y>H+50||it.x<-50||it.x>W+50)items.splice(i,1);
  }
}

function heart(x,y,s){
  ctx.beginPath();ctx.moveTo(x,y+s*.35);
  ctx.bezierCurveTo(x-s,y-s*.4,x-s*.4,y-s*1.1,x,y-s*.45);
  ctx.bezierCurveTo(x+s*.4,y-s*1.1,x+s,y-s*.4,x,y+s*.35);
  ctx.fill();
}

function draw(dt){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*28,(Math.random()-.5)*shake*28);
  const g=ctx.createLinearGradient(0,0,0,H);
  const bh=TH[2].a[S.th.b].h,hh=bh>=0?bh:(LV?(S.lvl>1000?(t*8)%360:LV.h):260);
  g.addColorStop(0,'hsl('+hh+',70%,7%)');
  g.addColorStop(.6,'hsl('+hh+',60%,14%)');
  g.addColorStop(1,'hsl('+hh+',55%,20%)');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);

  const sp=(st==='play'?.6+LV.sm*.1:.4)*(slowmo>0?.5:1);
  ctx.fillStyle='#fff';
  for(const s of stars){
    s.y+=dt*.08*s.z*sp;if(s.y>1){s.y=0;s.x=Math.random()}
    ctx.globalAlpha=.3+s.z*.6;ctx.fillRect(s.x*W,s.y*H,s.z*2,s.z*2);
  }
  ctx.globalAlpha=1;
  gridY=(gridY+dt*120*sp)%60;
  ctx.strokeStyle=slowmo>0?'rgba(34,230,255,.28)':'rgba(255,61,139,.22)';
  ctx.lineWidth=1;ctx.beginPath();
  for(let y=-60+gridY;y<H;y+=60){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  for(let x=0;x<=W;x+=W/6){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  ctx.stroke();

  ctx.globalCompositeOperation='lighter';
  // رسم الجزيئات
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue}
    q.x+=q.vx*dt;q.y+=q.vy*dt;
    ctx.globalAlpha=q.l/q.m;ctx.fillStyle=q.c;
    ctx.beginPath();ctx.arc(q.x,q.y,q.s*(q.l/q.m+.3),0,6.28);ctx.fill();
  }
  // رسم حلقات الصدمة النيون
  for(let i=rings.length-1;i>=0;i--){
    const rg=rings[i];rg.r+=rg.s*dt;
    if(rg.r>=rg.mr){rings.splice(i,1);continue}
    const al=1-rg.r/rg.mr;
    ctx.globalAlpha=al*.85;ctx.strokeStyle=rg.c;ctx.lineWidth=3.5*al+1;
    ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,6.28);ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  // رسم العناصر والقدرات الخارقة
  for(const it of items){
    ctx.save();ctx.translate(it.x,it.y);
    if(it.ty==='g'){
      ctx.scale(Math.abs(Math.cos(it.rot))*.6+.4,1);
      const G=TH[0].a[S.th.g];ctx.shadowColor=G.c;ctx.shadowBlur=18;ctx.fillStyle=G.c;
      ctx.beginPath();
      if(G.s===1)poly(ctx,5,20,9);
      else if(G.s===2)ctx.arc(0,0,14,0,6.28);
      else if(G.s===3)poly(ctx,3,16,16);
      else{ctx.moveTo(0,-20);ctx.lineTo(14,0);ctx.lineTo(0,20);ctx.lineTo(-14,0);ctx.closePath()}
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(5,-4);ctx.lineTo(0,0);ctx.lineTo(-8,-6);ctx.closePath();ctx.fill();
    }
    else if(it.ty==='h'){
      ctx.rotate(it.rot);const HT=TH[1].a[S.th.h];ctx.shadowColor=HT.c;ctx.shadowBlur=20;ctx.fillStyle=HT.c;
      ctx.beginPath();[()=>poly(ctx,8,24,10),()=>poly(ctx,4,22,17),()=>poly(ctx,4,24,7),()=>poly(ctx,4,22,22)][HT.s]();ctx.fill();
      ctx.fillStyle='#2a0612';ctx.beginPath();ctx.arc(0,0,5,0,6.28);ctx.fill();
    }
    else if(it.ty==='s'){
      ctx.shadowColor='#4dff9a';ctx.shadowBlur=20;ctx.strokeStyle='#4dff9a';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(0,0,18+Math.sin(it.rot*2)*2,0,6.28);ctx.stroke();
      ctx.fillStyle='rgba(77,255,154,.28)';ctx.fill();
      ctx.fillStyle='#fff';ctx.font='700 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🛡️',0,1);
    }
    else if(it.ty==='m'){
      ctx.shadowColor='#b07bff';ctx.shadowBlur=20;ctx.strokeStyle='#b07bff';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(0,0,18+Math.sin(it.rot*2)*2,0,6.28);ctx.stroke();
      ctx.fillStyle='rgba(176,123,255,.28)';ctx.fill();
      ctx.fillStyle='#fff';ctx.font='700 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🧲',0,1);
    }
    else if(it.ty==='w'){
      ctx.shadowColor='#ffd84a';ctx.shadowBlur=20;ctx.strokeStyle='#ffd84a';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(0,0,18+Math.sin(it.rot*2)*2,0,6.28);ctx.stroke();
      ctx.fillStyle='rgba(255,216,74,.28)';ctx.fill();
      ctx.fillStyle='#fff';ctx.font='700 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚡',0,1);
    }
    else if(it.ty==='z'){
      ctx.shadowColor='#22e6ff';ctx.shadowBlur=20;ctx.strokeStyle='#22e6ff';ctx.lineWidth=3.5;
      ctx.beginPath();ctx.arc(0,0,18+Math.sin(it.rot*2)*2,0,6.28);ctx.stroke();
      ctx.fillStyle='rgba(34,230,255,.28)';ctx.fill();
      ctx.fillStyle='#fff';ctx.font='700 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⏱️',0,1);
    }
    else{
      ctx.shadowColor='#ff6fae';ctx.shadowBlur=20;ctx.fillStyle='#ff6fae';heart(0,0,18+Math.sin(it.rot*3)*2);
    }
    ctx.restore();
  }

  // نصوص النقاط والكومبو الطائرة
  for(let i=floats.length-1;i>=0;i--){
    const fl=floats[i];fl.l-=dt*1.1;fl.y-=48*dt;
    if(fl.l<=0){floats.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=Math.max(0,fl.l);
    ctx.font='800 16px system-ui,sans-serif';ctx.textAlign='center';
    ctx.shadowColor=fl.c;ctx.shadowBlur=10;ctx.fillStyle=fl.c;
    ctx.fillText(fl.txt,fl.x,fl.y);ctx.restore();
  }

  if(banner>0&&st==='play'){
    banner-=dt;ctx.save();ctx.globalAlpha=Math.min(1,banner);ctx.textAlign='center';
    ctx.font='800 34px system-ui,sans-serif';ctx.shadowColor='#22e6ff';ctx.shadowBlur=20;ctx.fillStyle='#fff';
    ctx.fillText(X(S.lvl>1000?'∞ الفضاء الفسيح':'المستوى '+S.lvl+(LV.b?' 👹':'')),W/2,H*.38);
    ctx.restore();
  }

  if(B){
    ctx.save();ctx.translate(B.x,B.y);
    const rage=B.hp<B.m*.5;
    const c=B.fl>0?'#fff':(rage?'#ff3d5a':'hsl('+((S.lvl*37+180)%360)+',90%,60%)');
    ctx.shadowColor=c;ctx.shadowBlur=rage?34:26;ctx.fillStyle=c;
    ctx.beginPath();ctx.moveTo(-46,-20);ctx.lineTo(46,-20);ctx.lineTo(30,26);ctx.lineTo(0,38);ctx.lineTo(-30,26);ctx.closePath();ctx.fill();
    ctx.fillStyle='#10061f';ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(-9,0);ctx.arc(-16,0,7,0,6.28);ctx.moveTo(23,0);ctx.arc(16,0,7,0,6.28);ctx.fill();
    ctx.fillStyle='#ff3d5a';ctx.fillRect(-12,18,24,4);ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(W*.15,8,W*.7,8);
    ctx.fillStyle='#ff3d5a';ctx.fillRect(W*.15,8,W*.7*Math.max(0,B.hp)/B.m,8);
  }

  ctx.save();ctx.shadowColor='#ffd84a';ctx.shadowBlur=10;ctx.fillStyle=laser>0?'#ff8a3d':'#ffd84a';
  for(const b of bul)ctx.fillRect(b.x-2.5,b.y-10,5,18);
  ctx.restore();

  if(st==='play'||st==='menu'){
    const py=PY(),tilt=p.vx/(W*1.3)*.5;
    ctx.save();ctx.translate(p.x,py);ctx.rotate(tilt);
    if(magnet>0){
      ctx.save();ctx.strokeStyle='rgba(176,123,255,'+(.25+Math.sin(t*12)*.15)+')';
      ctx.lineWidth=2;ctx.setLineDash([6,6]);
      ctx.beginPath();ctx.arc(0,0,44+Math.sin(t*8)*4,0,6.28);ctx.stroke();ctx.restore();
    }
    if(shield>0){
      ctx.save();ctx.shadowColor='#4dff9a';ctx.shadowBlur=22;
      ctx.strokeStyle='rgba(77,255,154,'+(shield<2?(Math.sin(t*20)>0?.9:.2):.9)+')';
      ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,32,0,6.28);ctx.stroke();ctx.restore();
    }
    ship(ctx,S.ship,COLS[S.col]);
    ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,2,3,0,6.28);ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // تحديث واجهة اللعب وشريط التقدم والقدرات النشطة
  $('ps').style.display=st==='play'?'block':'none';
  $('sc').textContent=Math.floor(score||0);
  $('cb').textContent=st==='play'?'#'+S.lvl+' · '+(LV.b?'👹 زعيم':(S.lvl>1000?'∞ '+lg:lg+'/'+LV.goal))+(combo>=3?' 🔥x'+combo:''):'';
  $('lv').textContent=st==='play'?'♥'.repeat(Math.max(0,lives)):'';

  const pb=$('pbar');
  if(st==='play'){
    if(B){pb.className='boss';pb.style.width=Math.max(0,B.hp/B.m*100)+'%'}
    else{pb.className='';pb.style.width=(S.lvl>1000?100:Math.min(100,lg/LV.goal*100))+'%'}
    let phtml='';
    if(shield>0&&S.lvl<=1000)phtml+='<div class="pbadge" style="border-color:#4dff9a">🛡️ '+shield.toFixed(1)+'s</div>';
    if(magnet>0)phtml+='<div class="pbadge" style="border-color:#b07bff">🧲 '+magnet.toFixed(1)+'s</div>';
    if(laser>0)phtml+='<div class="pbadge" style="border-color:#ffd84a">⚡ '+laser.toFixed(1)+'s</div>';
    if(slowmo>0)phtml+='<div class="pbadge" style="border-color:#22e6ff">⏱️ '+slowmo.toFixed(1)+'s</div>';
    $('pbar-pwr').innerHTML=phtml;
  }else{
    pb.style.width='0%';
    $('pbar-pwr').innerHTML='';
  }
}

reset();
let last=performance.now();
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);fpsA+=(Math.min(.1,(ts-last)/1000||0)*1000-fpsA)*.04;last=ts;if(fpsA>27&&lowQ<2&&st==='play'){lowQ++;QF=lowQ===1?.25:0;fpsA=16;notify('تم تخفيف التأثيرات لتحسين الأداء')}
  if(st==='play')update(dt);
  {const ep=Math.min(100,Math.floor(emp||0));if(ep!==lastEp){lastEp=ep;empInd(ep)}}
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
